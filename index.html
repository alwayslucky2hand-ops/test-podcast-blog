<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>極簡智能影音錄製引擎</title>
  <!-- 載入 Lucide 極簡向量圖標庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #161618;
      --text: #ffffff;
      --accent: #0071e3;
      --danger: #ff453a;
      --warning: #ff9f0a;
      --glass: rgba(30, 30, 32, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0c0c0e;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .recorder-wrapper {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 播放器主視窗容器 (防破框核心) */
    .viewport-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: var(--card-bg);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--glass-border);
      touch-action: manipulation;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    /* 錄製狀態膠囊 (左上角) */
    .status-capsule {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 10px var(--danger); }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    /* 極簡浮動控制島 (底部中央) */
    .controls-island {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      z-index: 20;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .controls-island.autohide {
      opacity: 0;
      transform: translateX(-50%) translateY(12px);
      pointer-events: none;
    }

    /* 極簡控制按鈕 */
    .ctrl-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(1.05);
    }

    .ctrl-btn:active {
      transform: scale(0.95);
    }

    .ctrl-btn.active {
      background: rgba(255, 255, 255, 0.2);
    }

    .ctrl-btn.record-btn {
      color: var(--danger);
    }

    .ctrl-btn.stop-btn {
      color: var(--danger);
    }

    .ctrl-btn.pause-btn {
      color: var(--warning);
    }

    /* 終端訊息日誌 */
    .terminal-log {
      width: 100%;
      height: 90px;
      background: #111113;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 12px 16px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #34c759;
      overflow-y: auto;
    }

    /* 歸檔輸出區 */
    .archive-view {
      display: none;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      padding: 20px;
      margin-top: 8px;
      animation: fadeIn 0.3s ease;
    }

    .archive-view h4 {
      font-size: 15px;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .archive-text {
      white-space: pre-wrap;
      font-size: 13.5px;
      line-height: 1.7;
      color: #cfcfd4;
      max-height: 300px;
      overflow-y: auto;
      padding: 12px;
      background: #1c1c1e;
      border-radius: 12px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="recorder-wrapper">
  <!-- 播放與操作主視窗 -->
  <div class="viewport-container" id="videoWrapper" onmousemove="wakeControls()" ontouchstart="wakeControls()">
    
    <!-- 錄製狀態浮動標籤 -->
    <div id="statusBadge" class="status-capsule" style="display: none;">
      <div class="pulse-dot"></div>
      <span id="recordTimer">00:00</span>
    </div>

    <!-- 視訊畫面 -->
    <video id="mediaPlayer" autoplay muted playsinline></video>

    <!-- 極簡動態控制列島 -->
    <div id="controlsIsland" class="controls-island">
      
      <!-- 1. 切換影音來源 (電腦: 鏡頭/螢幕 | 手機: 前後鏡頭) -->
      <button class="ctrl-btn" id="btnSource" onclick="switchMediaSource()" title="切換錄製來源">
        <i data-lucide="camera" id="iconSource"></i>
      </button>

      <!-- 2. 切換影像啟用 (有螢幕 / 無螢幕黑屏收音) -->
      <button class="ctrl-btn" id="btnVideoTrack" onclick="toggleVideoTrack()" title="啟用/關閉畫面">
        <i data-lucide="video" id="iconVideo"></i>
      </button>

      <!-- 3. 錄影主控 (開始錄製) -->
      <button class="ctrl-btn record-btn" id="btnStart" onclick="startRecording()" title="開始錄影">
        <i data-lucide="circle-dot"></i>
      </button>

      <!-- 4. 暫停 / 繼續 -->
      <button class="ctrl-btn pause-btn" id="btnPause" onclick="togglePause()" style="display: none;" title="暫停錄製">
        <i data-lucide="pause" id="iconPause"></i>
      </button>

      <!-- 5. 停止錄影並歸檔 -->
      <button class="ctrl-btn stop-btn" id="btnStop" onclick="stopRecording()" style="display: none;" title="結束錄製">
        <i data-lucide="square"></i>
      </button>

    </div>
  </div>

  <!-- 系統底層監控日誌 -->
  <div class="terminal-log" id="sysLog">系統就緒，正在等待硬體權限授權...</div>

  <!-- 寫入完成與內容展示 -->
  <div id="archiveView" class="archive-view">
    <h4>✅ 影音日誌已成功歸檔至 Google 試算表</h4>
    <div id="archiveLinks" style="margin-bottom: 12px; font-size: 13px;"></div>
    <div id="archiveContent" class="archive-text"></div>
  </div>
</div>

<script>
  // 請填入部署的 GAS 網頁應用程式 URL
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyeqKhWv3TY8bpSdB9ZfWXNkR9yap66PyGxzEJqxpawWn9hZ9chfIuBPJfZHHoP91newQ/exec";

  // ================= 狀態變數管理 =================
  let currentStream = null;
  let mediaRecorder = null;
  let audioContext = null;
  let mixedAudioDest = null;

  let isRecording = false;
  let isPaused = false;
  let isVideoEnabled = true;
  let currentSourceType = "camera"; // "camera" | "screen"
  let mobileFacingMode = "user";    // "user" | "environment"

  let chunkIndex = 1;
  let chunkTimer = null;
  let timerInterval = null;
  let secondsElapsed = 0;
  let controlsTimeout = null;

  let sessionUrls = [];
  let sessionTranscripts = [];
  let activeUploadTasks = new Set();
  let logSession = null;

  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  function log(msg) {
    const el = document.getElementById('sysLog');
    el.innerHTML += `<br>> ${msg}`;
    el.scrollTop = el.scrollHeight;
  }

  // ================= 3秒自動隱藏控制列核心 =================
  function wakeControls() {
    const island = document.getElementById('controlsIsland');
    island.classList.remove('autohide');
    clearTimeout(controlsTimeout);

    // 僅在錄影中或操作時啟動 3 秒倒數收合
    controlsTimeout = setTimeout(() => {
      island.classList.add('autohide');
    }, 3000);
  }

  // ================= 影音串流獲取引擎 =================
  async function acquireStream() {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
    }
    if (audioContext) {
      audioContext.close();
      audioContext = null;
    }

    const audioConstraints = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };

    try {
      if (!isMobile && currentSourceType === "screen") {
        // 電腦端：螢幕畫面 + 系統聲音
        const screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 30 } },
          audio: true
        });

        // 同時獲取麥克風音軌並混音
        let micStream = null;
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
        } catch (e) {
          log("未獲取麥克風，將僅錄製系統音訊。");
        }

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        mixedAudioDest = audioContext.createMediaStreamDestination();

        if (screenStream.getAudioTracks().length > 0) {
          const screenAudioSource = audioContext.createMediaStreamSource(screenStream);
          screenAudioSource.connect(mixedAudioDest);
        }
        if (micStream && micStream.getAudioTracks().length > 0) {
          const micSource = audioContext.createMediaStreamSource(micStream);
          micSource.connect(mixedAudioDest);
        }

        currentStream = new MediaStream([
          screenStream.getVideoTracks()[0],
          mixedAudioDest.stream.getAudioTracks()[0]
        ]);

        // 監聽使用者點擊瀏覽器自帶的「停止共用」
        screenStream.getVideoTracks()[0].onended = () => {
          switchMediaSource();
        };

        document.getElementById('iconSource').setAttribute('data-lucide', 'monitor');
      } else {
        // 電腦視訊 或 手機相機
        const videoConstraints = isMobile
          ? { facingMode: mobileFacingMode, width: { ideal: 1280 } }
          : { width: { ideal: 1280 }, height: { ideal: 720 } };

        currentStream = await navigator.mediaDevices.getUserMedia({
          video: videoConstraints,
          audio: audioConstraints
        });

        document.getElementById('iconSource').setAttribute('data-lucide', isMobile ? 'switch-camera' : 'camera');
      }

      document.getElementById('mediaPlayer').srcObject = currentStream;

      // 同步影像開關狀態
      const vTrack = currentStream.getVideoTracks()[0];
      if (vTrack) vTrack.enabled = isVideoEnabled;

      lucide.createIcons();
      log(`硬體載入成功：[${isMobile ? '手機 ' + mobileFacingMode : currentSourceType}]`);
    } catch (err) {
      log("硬體存取失敗：" + err.message);
    }
  }

  // ================= 1. 切換有/無螢幕錄影 =================
  function toggleVideoTrack() {
    isVideoEnabled = !isVideoEnabled;
    if (currentStream && currentStream.getVideoTracks().length > 0) {
      currentStream.getVideoTracks()[0].enabled = isVideoEnabled;
    }

    const icon = document.getElementById('iconVideo');
    icon.setAttribute('data-lucide', isVideoEnabled ? 'video' : 'video-off');
    document.getElementById('btnVideoTrack').classList.toggle('active', !isVideoEnabled);
    lucide.createIcons();

    log(`視訊畫面已${isVideoEnabled ? '開啟' : '關閉（僅純音訊收音）'}`);
    wakeControls();
  }

  // ================= 2. 切換錄影來源 =================
  async function switchMediaSource() {
    if (isMobile) {
      mobileFacingMode = (mobileFacingMode === "user") ? "environment" : "user";
    } else {
      currentSourceType = (currentSourceType === "camera") ? "screen" : "camera";
    }

    const wasRecording = isRecording;
    if (wasRecording && mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      clearTimeout(chunkTimer);
    }

    await acquireStream();

    if (wasRecording && !isPaused) {
      startChunkRecording();
    }
    wakeControls();
  }

  // ================= 3. 錄製控制邏輯 =================
  async function startRecording() {
    document.getElementById('btnStart').disabled = true;
    document.getElementById('archiveView').style.display = 'none';
    log("正在向雲端建立專屬日誌資料夾與試算表索引...");

    try {
      logSession = await api({ action: "initLog" });
      isRecording = true;
      isPaused = false;
      chunkIndex = 1;
      sessionUrls = [];
      sessionTranscripts = [];
      secondsElapsed = 0;

      // 更新按鈕排版狀態
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnPause').style.display = 'flex';
      document.getElementById('btnStop').style.display = 'flex';
      document.getElementById('statusBadge').style.display = 'flex';

      startTimer();
      startChunkRecording();
      wakeControls();
      log("錄製引擎啟動，每 60 秒切片無縫上傳辨識。");
    } catch (e) {
      log("初始化錯誤：" + e.message);
      document.getElementById('btnStart').disabled = false;
    }
  }

  function startChunkRecording() {
    if (!isRecording || !currentStream || isPaused) return;

    let chunks = [];
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
    mediaRecorder = new MediaRecorder(currentStream, { mimeType: mime });

    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      if (chunks.length > 0) {
        processChunk(new Blob(chunks, { type: mime }), mime, chunkIndex++);
      }
      if (isRecording && !isPaused) {
        startChunkRecording();
      }
    };

    mediaRecorder.start();
    chunkTimer = setTimeout(() => {
      if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
    }, 60000);
  }

  function processChunk(blob, mime, index) {
    log(`區段 ${index} 封裝完成，背景上傳至 Drive 並呼叫 AI...`);
    const task = new Promise(resolve => {
      const reader = new FileReader();
      reader.readAsDataURL(blob);
      reader.onloadend = async () => {
        const base64 = reader.result.split(',')[1];
        try {
          const driveUrl = await api({
            action: "saveChunk",
            base64Data: base64,
            mimeType: mime,
            folderId: logSession.folderId,
            chunkIndex: index
          });
          sessionUrls.push(driveUrl);

          const aiText = await api({
            action: "recognizeAI",
            base64Data: base64,
            mimeType: mime,
            chunkIndex: index
          });
          sessionTranscripts.push({ index: index, text: aiText });

          log(`✅ 區段 ${index} 辨識完成！`);
        } catch (e) {
          log(`❌ 區段 ${index} 失敗: ${e.message}`);
        }
        resolve();
      };
    });
    activeUploadTasks.add(task);
    task.then(() => activeUploadTasks.delete(task));
  }

  function togglePause() {
    if (!isRecording) return;

    const pauseIcon = document.getElementById('iconPause');
    if (!isPaused) {
      isPaused = true;
      if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
      clearTimeout(chunkTimer);
      clearInterval(timerInterval);
      pauseIcon.setAttribute('data-lucide', 'play');
      log("錄製已暫停。");
    } else {
      isPaused = false;
      startTimer();
      startChunkRecording();
      pauseIcon.setAttribute('data-lucide', 'pause');
      log("錄製已恢復。");
    }
    lucide.createIcons();
    wakeControls();
  }

  async function stopRecording() {
    isRecording = false;
    isPaused = false;
    clearTimeout(chunkTimer);
    clearInterval(timerInterval);

    if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();

    document.getElementById('btnStop').disabled = true;
    document.getElementById('btnPause').style.display = 'none';
    document.getElementById('statusBadge').style.display = 'none';

    log("正在等待背景佇列上傳完成...");
    while (activeUploadTasks.size > 0) {
      await Promise.all(Array.from(activeUploadTasks));
    }

    log("所有影音切片處理完畢，寫入試算表總帳中...");

    try {
      sessionTranscripts.sort((a, b) => a.index - b.index);
      const res = await api({
        action: "finalizeLog",
        rowIndex: logSession.rowIndex,
        urls: sessionUrls,
        transcripts: sessionTranscripts
      });

      log("🎉 試算表寫入成功！");

      // 呈現於下方結果板
      document.getElementById('archiveLinks').innerHTML = res.urls
        .map((u, i) => `<a href="${u}" target="_blank" style="color:var(--accent); text-decoration:none; display:inline-block; margin-right:12px;">📁 雲端切片 ${i+1}</a>`)
        .join('');
      document.getElementById('archiveContent').innerText = res.content;
      document.getElementById('archiveView').style.display = 'block';

      // 重置介面控制項
      document.getElementById('btnStop').style.display = 'none';
      document.getElementById('btnStop').disabled = false;
      document.getElementById('btnStart').style.display = 'flex';
      document.getElementById('btnStart').disabled = false;
    } catch (e) {
      log("歸檔失敗：" + e.message);
    }
    wakeControls();
  }

  // ================= 計時器與輔助函式 =================
  function startTimer() {
    timerInterval = setInterval(() => {
      secondsElapsed++;
      const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const s = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('recordTimer').innerText = `${m}:${s}`;
    }, 1000);
  }

  async function api(payload) {
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
    const json = await res.json();
    if (json.status === 'success') return json.data;
    throw new Error(json.message);
  }

  // 頁面初次載入啟動授權
  window.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    acquireStream();
  });
</script>

</body>
</html>
