<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>極簡智能影音錄製與日誌系統</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #0c0c0e;
      --card-bg: #161618;
      --text: #ffffff;
      --text-muted: #86868b;
      --accent: #0071e3;
      --danger: #ff453a;
      --warning: #ff9f0a;
      --success: #34c759;
      --glass: rgba(28, 28, 30, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px 16px;
      color: var(--text);
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 頂部極簡雙分頁導航 */
    .tab-nav {
      display: flex;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      gap: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 14.5px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--glass);
      color: var(--text);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      border: 1px solid var(--glass-border);
    }

    .tab-content { display: none; flex-direction: column; gap: 16px; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: flex; }

    /* 播放器視窗容器 */
    .viewport-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: var(--card-bg);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--glass-border);
    }

    video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }

    /* 錄製狀態浮動標籤 */
    .status-capsule {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 10;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 10px var(--danger); }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    /* 極簡浮動控制島 */
    .controls-island {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      z-index: 20;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .controls-island.autohide {
      opacity: 0;
      transform: translateX(-50%) translateY(12px);
      pointer-events: none;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: background 0.2s, transform 0.15s;
    }

    .ctrl-btn:hover { background: rgba(255, 255, 255, 0.12); transform: scale(1.05); }
    .ctrl-btn:active { transform: scale(0.95); }
    .ctrl-btn.active { background: rgba(255, 255, 255, 0.2); }
    .ctrl-btn.record-btn { color: var(--danger); }
    .ctrl-btn.stop-btn { color: var(--danger); }
    .ctrl-btn.pause-btn { color: var(--warning); }

    .terminal-log {
      width: 100%;
      height: 90px;
      background: #111113;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 12px 16px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      line-height: 1.6;
      color: var(--success);
      overflow-y: auto;
    }

    /* 歸檔輸出區 */
    .archive-view {
      display: none;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .archive-text {
      white-space: pre-wrap;
      font-size: 13.5px;
      line-height: 1.7;
      color: #cfcfd4;
      max-height: 320px;
      overflow-y: auto;
      padding: 14px;
      background: #1c1c1e;
      border-radius: 12px;
    }

    /* 第二分頁歷史紀錄卡片 */
    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 12px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(52, 199, 89, 0.15);
      color: var(--success);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="app-shell">
  
  <!-- 雙分頁導航 -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('tab-live')">
      <i data-lucide="video"></i> 影音即時錄製
    </button>
    <button class="tab-btn" onclick="switchTab('tab-history')">
      <i data-lucide="history"></i> 歷史日誌調閱
    </button>
  </div>

  <!-- 分頁 1：即時錄製 -->
  <div id="tab-live" class="tab-content active">
    <div class="viewport-container" id="videoWrapper" onmousemove="wakeControls()" ontouchstart="wakeControls()">
      
      <div id="statusBadge" class="status-capsule" style="display: none;">
        <div class="pulse-dot"></div>
        <span id="recordTimer">00:00</span>
      </div>

      <video id="mediaPlayer" autoplay muted playsinline></video>

      <div id="controlsIsland" class="controls-island">
        <!-- 切換來源 (相機/螢幕 或 手機前後鏡頭) -->
        <button class="ctrl-btn" id="btnSource" onclick="switchMediaSource()" title="切換錄製來源">
          <i data-lucide="camera" id="iconSource"></i>
        </button>

        <!-- 切換影像 (有畫面 / 純音訊收音) -->
        <button class="ctrl-btn" id="btnVideoTrack" onclick="toggleVideoTrack()" title="開啟/關閉畫面">
          <i data-lucide="video" id="iconVideo"></i>
        </button>

        <!-- 開始錄製 -->
        <button class="ctrl-btn record-btn" id="btnStart" onclick="startRecording()" title="開始錄影">
          <i data-lucide="circle-dot"></i>
        </button>

        <!-- 暫停 / 繼續 -->
        <button class="ctrl-btn pause-btn" id="btnPause" onclick="togglePause()" style="display: none;" title="暫停錄製">
          <i data-lucide="pause" id="iconPause"></i>
        </button>

        <!-- 停止錄影並歸檔 -->
        <button class="ctrl-btn stop-btn" id="btnStop" onclick="stopRecording()" style="display: none;" title="結束錄製">
          <i data-lucide="square"></i>
        </button>
      </div>
    </div>

    <div class="terminal-log" id="sysLog">系統準備就緒...</div>

    <!-- 即時歸檔結果卡片 -->
    <div id="archiveView" class="archive-view">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h4 style="margin: 0; color: var(--success); font-size: 16px;">🎉 影音日誌已成功歸檔至 Google 試算表</h4>
        <div id="archiveLinks" style="font-size: 13px;"></div>
      </div>

      <div style="margin-bottom: 16px;">
        <div style="font-weight: 700; font-size: 14px; color: var(--accent); margin-bottom: 8px;">🎯 AI 全局重點整理</div>
        <div id="archiveSummary" class="archive-text" style="border-left: 4px solid var(--accent); background: #18181b;"></div>
      </div>

      <details style="cursor: pointer;">
        <summary style="font-weight: 600; font-size: 13px; color: var(--text-muted); outline: none; margin-bottom: 8px;">
          👁️ 展開檢視各分鐘畫面描述與逐字稿總帳
        </summary>
        <div id="archiveContent" class="archive-text" style="margin-top: 8px;"></div>
      </details>
    </div>
  </div>

  <!-- 分頁 2：歷史紀錄調閱 -->
  <div id="tab-history" class="tab-content">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="font-size: 18px; font-weight: 700;">歷史影音日誌總帳</h3>
      <button onclick="loadHistoryLogs()" class="ctrl-btn" style="width: auto; height: auto; padding: 8px 14px; border-radius: 10px; background: var(--card-bg); border: 1px solid var(--glass-border); font-size: 13px;">
        <i data-lucide="refresh-cw" style="width: 14px; margin-right: 4px;"></i> 重新整理
      </button>
    </div>
    <div id="historyContainer" style="display: flex; flex-direction: column; gap: 16px;">
      <div style="text-align: center; color: var(--text-muted); padding: 40px 0;">點擊重新整理載入歷史資料...</div>
    </div>
  </div>

</div>

<script>
  // 🌟 已直接帶入你的 GAS 網址
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyeqKhWv3TY8bpSdB9ZfWXNkR9yap66PyGxzEJqxpawWn9hZ9chfIuBPJfZHHoP91newQ/exec";

  let currentStream = null;
  let mediaRecorder = null;
  let audioContext = null;
  let mixedAudioDest = null;

  let isRecording = false;
  let isPaused = false;
  let isVideoEnabled = true;
  let currentSourceType = "camera";
  let mobileFacingMode = "user";

  let chunkIndex = 1;
  let chunkTimer = null;
  let timerInterval = null;
  let secondsElapsed = 0;
  let controlsTimeout = null;

  let activeUploadTasks = new Set();
  let logSession = null;
  let recordedChunks = []; // 暫存切片 blob 陣列

  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  function log(msg) {
    const el = document.getElementById('sysLog');
    el.innerHTML += `<br>> ${msg}`;
    el.scrollTop = el.scrollHeight;
  }

  function wakeControls() {
    const island = document.getElementById('controlsIsland');
    island.classList.remove('autohide');
    clearTimeout(controlsTimeout);

    controlsTimeout = setTimeout(() => {
      island.classList.add('autohide');
    }, 3000);
  }

  // 雙分頁切換
  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    event.currentTarget.classList.add('active');
    document.getElementById(tabId).classList.add('active');

    if (tabId === 'tab-history') {
      loadHistoryLogs();
    }
  }

  // 影音串流獲取
  async function acquireStream() {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
      currentStream = null;
    }
    if (audioContext) {
      audioContext.close();
      audioContext = null;
    }

    const audioConstraints = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };

    try {
      if (!isMobile && currentSourceType === "screen") {
        const screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 30 } },
          audio: true
        });

        let micStream = null;
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
        } catch (e) {
          log("未獲取麥克風，僅收錄系統聲音。");
        }

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        mixedAudioDest = audioContext.createMediaStreamDestination();

        if (screenStream.getAudioTracks().length > 0) {
          const screenAudioSource = audioContext.createMediaStreamSource(screenStream);
          screenAudioSource.connect(mixedAudioDest);
        }
        if (micStream && micStream.getAudioTracks().length > 0) {
          const micSource = audioContext.createMediaStreamSource(micStream);
          micSource.connect(mixedAudioDest);
        }

        currentStream = new MediaStream([
          screenStream.getVideoTracks()[0],
          mixedAudioDest.stream.getAudioTracks()[0]
        ]);

        screenStream.getVideoTracks()[0].onended = () => {
          if (currentSourceType === "screen") {
            log("螢幕共用中斷，自動切回鏡頭模式繼續錄製...");
            switchMediaSource();
          }
        };

        document.getElementById('iconSource').setAttribute('data-lucide', 'monitor');
      } else {
        const videoConstraints = isMobile
          ? { facingMode: mobileFacingMode, width: { ideal: 1280 } }
          : { width: { ideal: 1280 }, height: { ideal: 720 } };

        currentStream = await navigator.mediaDevices.getUserMedia({
          video: videoConstraints,
          audio: audioConstraints
        });

        document.getElementById('iconSource').setAttribute('data-lucide', isMobile ? 'switch-camera' : 'camera');
      }

      document.getElementById('mediaPlayer').srcObject = currentStream;

      const vTrack = currentStream.getVideoTracks()[0];
      if (vTrack) vTrack.enabled = isVideoEnabled;

      lucide.createIcons();
      log(`硬體就緒：[${isMobile ? '手機 ' + mobileFacingMode : currentSourceType}]`);
      return true;
    } catch (err) {
      log("硬體存取失敗：" + err.message);
      return false;
    }
  }

  function toggleVideoTrack() {
    isVideoEnabled = !isVideoEnabled;
    if (currentStream && currentStream.getVideoTracks().length > 0) {
      currentStream.getVideoTracks()[0].enabled = isVideoEnabled;
    }

    const icon = document.getElementById('iconVideo');
    icon.setAttribute('data-lucide', isVideoEnabled ? 'video' : 'video-off');
    document.getElementById('btnVideoTrack').classList.toggle('active', !isVideoEnabled);
    lucide.createIcons();

    log(`視訊畫面已${isVideoEnabled ? '開啟' : '關閉（純音訊收音）'}`);
    wakeControls();
  }

  // 無縫切換影音來源
  async function switchMediaSource() {
    const wasRecording = isRecording;
    const prevSourceType = currentSourceType;
    const prevFacingMode = mobileFacingMode;

    if (isMobile) {
      mobileFacingMode = (mobileFacingMode === "user") ? "environment" : "user";
    } else {
      currentSourceType = (currentSourceType === "camera") ? "screen" : "camera";
    }

    // 封裝切換前的片段
    if (wasRecording && mediaRecorder && mediaRecorder.state === "recording") {
      clearTimeout(chunkTimer);
      mediaRecorder.stop();
    }

    log(`切換來源至 [${isMobile ? mobileFacingMode : currentSourceType}]...`);
    const success = await acquireStream();

    if (!success) {
      log("⚠️ 來源切換取消，自動恢復原設備...");
      currentSourceType = prevSourceType;
      mobileFacingMode = prevFacingMode;
      await acquireStream();
    }

    if (wasRecording && !isPaused && currentStream) {
      startChunkRecording();
      log("✅ 設備切換完成，已無縫接軌繼續錄影！");
    }
    wakeControls();
  }

  // 開始錄影
  async function startRecording() {
    document.getElementById('btnStart').disabled = true;
    document.getElementById('archiveView').style.display = 'none';

    if (!currentStream || currentStream.getTracks().every(t => t.readyState === 'ended')) {
      log("喚醒攝影機與麥克風中...");
      const ok = await acquireStream();
      if (!ok) {
        document.getElementById('btnStart').disabled = false;
        return;
      }
    }

    log("正在向雲端建立專屬日誌資料夾與試算表列...");

    try {
      logSession = await api({ action: "initLog" });
      isRecording = true;
      isPaused = false;
      chunkIndex = 1;
      secondsElapsed = 0;

      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnPause').style.display = 'flex';
      document.getElementById('btnStop').style.display = 'flex';
      document.getElementById('statusBadge').style.display = 'flex';

      startTimer();
      startChunkRecording();
      wakeControls();
      log("三軌並行引擎啟動：每 60 秒切片無縫上傳，並即時寫入試算表！");
    } catch (e) {
      log("初始化錯誤：" + e.message);
      document.getElementById('btnStart').disabled = false;
    }
  }

  function startChunkRecording() {
    if (!isRecording || !currentStream || isPaused) return;

    recordedChunks = [];
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
    mediaRecorder = new MediaRecorder(currentStream, { mimeType: mime });

    mediaRecorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      if (recordedChunks.length > 0) {
        const chunkBlob = new Blob(recordedChunks, { type: mime });
        processChunk(chunkBlob, mime, chunkIndex++);
        recordedChunks = [];
      }
      if (isRecording && !isPaused && mediaRecorder && mediaRecorder.state === "inactive") {
        startChunkRecording();
      }
    };

    mediaRecorder.start();
    chunkTimer = setTimeout(() => {
      if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
    }, 60000);
  }

  function processChunk(blob, mime, index) {
    log(`區段 ${index} 切片完成，背景傳輸至雲端中...`);
    const task = new Promise(resolve => {
      const reader = new FileReader();
      reader.readAsDataURL(blob);
      reader.onloadend = async () => {
        const base64 = reader.result.split(',')[1];
        try {
          await api({
            action: "processChunkRealtime",
            base64Data: base64,
            mimeType: mime,
            folderId: logSession.folderId,
            rowIndex: logSession.rowIndex,
            chunkIndex: index
          });

          log(`✅ 區段 ${index} 已即時寫入試算表儲存格與雲端硬碟！`);
        } catch (e) {
          log(`❌ 區段 ${index} 處理失敗: ${e.message}`);
        }
        resolve();
      };
    });
    activeUploadTasks.add(task);
    task.then(() => activeUploadTasks.delete(task));
  }

  function togglePause() {
    if (!isRecording) return;

    const pauseIcon = document.getElementById('iconPause');
    if (!isPaused) {
      isPaused = true;
      if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
      clearTimeout(chunkTimer);
      clearInterval(timerInterval);
      pauseIcon.setAttribute('data-lucide', 'play');
      log("錄製已暫停。");
    } else {
      isPaused = false;
      startTimer();
      startChunkRecording();
      pauseIcon.setAttribute('data-lucide', 'pause');
      log("錄製已恢復。");
    }
    lucide.createIcons();
    wakeControls();
  }

  // 🌟 非同步收尾保全：確保未滿 1 分鐘的切片 100% 寫入
  function stopMediaRecorderAsync() {
    return new Promise((resolve) => {
      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        resolve();
        return;
      }
      const originalOnStop = mediaRecorder.onstop;
      mediaRecorder.onstop = (e) => {
        if (originalOnStop) originalOnStop(e);
        resolve();
      };
      mediaRecorder.stop();
    });
  }

  // 🌟 停止錄影並歸檔
  async function stopRecording() {
    isRecording = false;
    isPaused = false;
    clearTimeout(chunkTimer);
    clearInterval(timerInterval);

    // 1. 強制封裝最後一段影音切片（即便只有幾秒）
    await stopMediaRecorderAsync();

    // 2. 立即關閉硬體攝影機與麥克風，指示燈即刻熄滅
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
      currentStream = null;
    }
    if (document.getElementById('mediaPlayer')) {
      document.getElementById('mediaPlayer').srcObject = null;
    }
    if (audioContext) {
      audioContext.close();
      audioContext = null;
    }
    log("🔒 攝影機已徹底關閉，指示燈熄滅。正在等待背景最後切片寫入試算表...");

    document.getElementById('btnStop').disabled = true;
    document.getElementById('btnPause').style.display = 'none';
    document.getElementById('statusBadge').style.display = 'none';

    // 3. 等待所有進行中的切片（含尾段）全部完成上傳與辨識
    while (activeUploadTasks.size > 0) {
      await Promise.all(Array.from(activeUploadTasks));
    }

    log("所有影音切片皆已歸檔試算表！正在提煉 AI 全局重點整理...");

    try {
      // 4. 呼叫後端 finalizeLog 產出重點整理
      const res = await api({
        action: "finalizeLog",
        rowIndex: logSession.rowIndex
      });

      log("🎉 試算表最終歸檔完成！已載入至下方檢視區。");

      // 渲染切片影片連結
      document.getElementById('archiveLinks').innerHTML = res.urls
        .map((u, i) => `<a href="${u}" target="_blank" style="color:var(--accent); text-decoration:none; margin-left:8px;">📁 片段 ${i+1}</a>`)
        .join('');

      // 渲染 AI 全局重點整理
      document.getElementById('archiveSummary').innerText = res.summary;

      // 渲染每分鐘畫面描述與逐字稿
      document.getElementById('archiveContent').innerText = res.content;
      document.getElementById('archiveView').style.display = 'block';

      // 重置操作按鈕
      document.getElementById('btnStop').style.display = 'none';
      document.getElementById('btnStop').disabled = false;
      document.getElementById('btnStart').style.display = 'flex';
      document.getElementById('btnStart').disabled = false;
    } catch (e) {
      log("歸檔失敗：" + e.message);
    }
    wakeControls();
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      secondsElapsed++;
      const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const s = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('recordTimer').innerText = `${m}:${s}`;
    }, 1000);
  }

  // 第二分頁：載入歷史日誌
  async function loadHistoryLogs() {
    const container = document.getElementById('historyContainer');
    container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:30px 0;"><i data-lucide="loader" class="spin"></i> 載入中...</div>`;
    lucide.createIcons();

    try {
      const logs = await api({ action: "getHistoryLogs" });
      if (!logs || logs.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:40px 0;">目前尚無歷史錄影紀錄。</div>`;
        return;
      }

      container.innerHTML = logs.map(item => `
        <div class="history-card">
          <div class="history-header">
            <div>
              <div style="font-weight: 700; font-size: 15px;">日誌 ID: ${item.logId}</div>
              <div style="font-size: 12px; color: var(--text-muted); font-family: monospace; margin-top: 4px;">${item.timestamp}</div>
            </div>
            <span class="badge">${item.status}</span>
          </div>

          <div>
            <div style="font-weight: 600; font-size: 13px; color: var(--accent); margin-bottom: 6px;">雲端切片檔案</div>
            <div style="font-size: 13px;">
              ${item.urls.length > 0 
                ? item.urls.map((u, i) => `<a href="${u}" target="_blank" style="color:var(--accent); text-decoration:none; margin-right:12px;">📁 片段 ${i+1}</a>`).join('')
                : '<span style="color:var(--text-muted)">無影片連結</span>'}
            </div>
          </div>

          <div>
            <div style="font-weight: 600; font-size: 13px; color: var(--accent); margin-bottom: 6px;">🎯 AI 全局重點整理</div>
            <div class="archive-text" style="padding: 10px; font-size: 13px; background: #111;">${item.summary}</div>
          </div>

          <details style="cursor: pointer;">
            <summary style="font-size: 12.5px; color: var(--text-muted); outline: none;">👁️ 查看詳細畫面描述與逐字稿</summary>
            <div class="archive-text" style="margin-top: 8px; font-size: 12.5px;">${item.content}</div>
          </details>
        </div>
      `).join('');

      lucide.createIcons();
    } catch (e) {
      container.innerHTML = `<div style="text-align:center; color:var(--danger); padding:30px 0;">載入失敗：${e.message}</div>`;
    }
  }

  async function api(payload) {
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
    const json = await res.json();
    if (json.status === 'success') return json.data;
    throw new Error(json.message);
  }

  window.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    acquireStream();
  });
</script>

</body>
</html>
